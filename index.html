<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First RP</title>
<meta name="description" content="Regras e preços entre jogadores do servidor First RP (FiveM).">
<meta property="og:title" content="First RP">
<meta property="og:description" content="Regras do servidor e preços entre jogadores.">
<meta name="theme-color" content="#F5B02E">
<link rel="icon" href="logo.png">
<style>
:root{--bg:#0b0d12;--panel:#14171e;--line:#262a33;--fg:#eef0f4;--mut:#9aa1ad;--acc:#F5B02E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 30% 20%,rgba(245,176,46,.12),transparent 60%),var(--bg);color:var(--fg);font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;padding:24px 16px}
main{width:100%;max-width:520px;text-align:center}
img{width:120px;height:120px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
h1{font-size:34px;margin:18px 0 4px;letter-spacing:.02em}
h1 b{color:var(--acc)}
p{color:var(--mut);margin:0 0 28px}
a.btn{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;transition:border-color .15s,transform .15s}
a.btn:hover{border-color:var(--acc);transform:translateY(-2px)}
.ic{font-size:28px}
.t{font-weight:700;font-size:18px}
.s{color:var(--mut);font-size:14px}
footer{color:var(--mut);font-size:13px;margin-top:22px}
</style>
</head>
<body>
<main>
<img src="logo.png" alt="First RP">
<h1>FIRST <b>RP</b></h1>
<p>Servidor FiveM de roleplay português</p>
<a class="btn" href="regras/"><span class="ic">📜</span><span><span class="t">Regras do servidor</span><br><span class="s">Lê antes de entrares na cidade</span></span></a>
<a class="btn" href="precos/"><span class="ic">💰</span><span><span class="t">Preços entre jogadores</span><br><span class="s">Mínimo e máximo para vender itens, armas, droga e mais</span></span></a>
<footer>© First RP</footer>
</main>
</body>
</html>
